<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a12"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.15" fill="none" stroke="#4ade80" stroke-width="2">
    <rect x="180" y="140" width="440" height="30" rx="4"/>
    <rect x="180" y="185" width="220" height="30" rx="4"/>
    <rect x="180" y="230" width="110" height="30" rx="4"/>
    <rect x="180" y="275" width="55" height="30" rx="4" fill="#4ade80" opacity="0.3"/>
    <line x1="290" y1="140" x2="290" y2="320" stroke-dasharray="4,4" opacity="0.5"/>
  </g>
  <g opacity="0.12" fill="none" stroke="#86efac" stroke-width="1.5">
    <text x="550" y="175" font-size="16" font-family="monospace" fill="#86efac">mid = (l+r)/2</text>
    <text x="550" y="215" font-size="16" font-family="monospace" fill="#86efac">if arr[mid] &lt; t:</text>
    <text x="560" y="245" font-size="16" font-family="monospace" fill="#86efac">l = mid + 1</text>
  </g>
  <text x="400" y="400" text-anchor="middle" font-size="42" font-weight="bold" fill="#dcfce7" font-family="system-ui, sans-serif">Binary Search</text>
  <text x="400" y="430" text-anchor="middle" font-size="18" fill="#4ade80" font-family="system-ui, sans-serif">ค้นหาใน 1 พันล้านข้อมูลด้วย 30 ครั้ง</text>
</svg>

  <!-- Subtle accent dots scattered -->
  <circle cx="120" cy="80" r="2" fill="#2dd4bf" opacity="0.25"/>
  <circle cx="350" cy="140" r="1.5" fill="#14b8a6" opacity="0.2"/>
  <circle cx="580" cy="65" r="2" fill="#5eead4" opacity="0.25"/>
  <circle cx="780" cy="190" r="1.8" fill="#14b8a6" opacity="0.2"/>
  <circle cx="1020" cy="110" r="2" fill="#2dd4bf" opacity="0.25"/>
  <circle cx="250" cy="260" r="1.5" fill="#5eead4" opacity="0.2"/>
  <circle cx="680" cy="320" r="1.8" fill="#14b8a6" opacity="0.2"/>
  <circle cx="950" cy="290" r="2" fill="#2dd4bf" opacity="0.2"/>
</svg>
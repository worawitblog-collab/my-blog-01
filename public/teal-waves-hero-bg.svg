<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="none">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="waveGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#99f6e4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="waveGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#115e59" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#134e4a" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Wave 1 - top, light teal -->
  <path d="M0,60 C150,20 300,100 450,60 C600,20 750,90 900,50 C1050,10 1100,80 1200,40"
        fill="none" stroke="url(#waveGrad4)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M0,65 C150,25 300,105 450,65 C600,25 750,95 900,55 C1050,15 1100,85 1200,45"
        fill="none" stroke="url(#waveGrad4)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Wave 2 -->
  <path d="M0,110 C200,70 350,160 500,110 C650,60 800,150 950,100 C1100,50 1150,130 1200,90"
        fill="none" stroke="url(#waveGrad2)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M0,115 C200,75 350,165 500,115 C650,65 800,155 950,105 C1100,55 1150,135 1200,95"
        fill="none" stroke="url(#waveGrad2)" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>

  <!-- Wave 3 - center, prominent -->
  <path d="M0,170 C180,120 380,220 560,170 C740,120 900,210 1060,160 C1140,135 1180,185 1200,165"
        fill="none" stroke="url(#waveGrad1)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M0,175 C180,125 380,225 560,175 C740,125 900,215 1060,165 C1140,140 1180,190 1200,170"
        fill="none" stroke="url(#waveGrad1)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Wave 4 -->
  <path d="M0,230 C220,180 400,280 580,230 C760,180 920,270 1080,220 C1150,200 1190,250 1200,230"
        fill="none" stroke="url(#waveGrad3)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M0,235 C220,185 400,285 580,235 C760,185 920,275 1080,225 C1150,205 1190,255 1200,235"
        fill="none" stroke="url(#waveGrad3)" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>

  <!-- Wave 5 -->
  <path d="M0,285 C160,240 360,340 540,290 C720,240 880,330 1040,280 C1120,255 1170,305 1200,285"
